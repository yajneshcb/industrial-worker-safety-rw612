# Project configuration for the MCUXpresso SDK freestanding build (FRDM-RW612).
# The board's own prj.conf already enables the board file, clock config and board suite.

# This project ships its own pin_mux.c / hardware_init.c (source/board_port), so the SDK
# example-folder segments must NOT be pulled in.
CONFIG_MCUX_PRJSEG_module.board.pinmux_project_folder=n
CONFIG_MCUX_PRJSEG_module.board.pinmux_board_folder=n
CONFIG_MCUX_HAS_PRJSEG_project.use_hw_app=n
CONFIG_MCUX_HAS_PRJSEG_module.board.pinmux_sel=n
CONFIG_MCUX_PRJSEG_project.hw_app_project_folder=n

# Drivers used by the application
CONFIG_MCUX_COMPONENT_driver.flexcomm_i2c=y
CONFIG_MCUX_COMPONENT_driver.inputmux=y
CONFIG_MCUX_COMPONENT_driver.cns_adc=y
CONFIG_MCUX_COMPONENT_driver.lpc_gpio=y
CONFIG_MCUX_COMPONENT_driver.io_mux=y
CONFIG_MCUX_COMPONENT_driver.power=y
CONFIG_MCUX_COMPONENT_driver.reset=y
CONFIG_MCUX_COMPONENT_driver.clock=y

# RW612 WLAN client, FreeRTOS scheduler and lwIP socket stack.
CONFIG_MCUX_COMPONENT_component.wifi_bt_module.config=y
CONFIG_MCUX_COMPONENT_component.wifi_bt_module.wifi_fw=y
CONFIG_MCUX_COMPONENT_middleware.wifi=y
CONFIG_MCUX_DEPENDENCY_COMPONENT_middleware.wifi.wifidriver_DEPEND_ANYOF_OPTION_2=y
CONFIG_MCUX_COMPONENT_middleware.edgefast_wifi_nxp=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.heap_4=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.extension=y
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel.cm33_non_trustzone=y
CONFIG_MCUX_COMPONENT_middleware.lwip=y
CONFIG_MCUX_COMPONENT_middleware.lwip.apps.sntp=y
CONFIG_MCUX_COMPONENT_middleware.mbedtls3x=y
CONFIG_MCUX_COMPONENT_middleware.mbedtls3x.no_psa=y
CONFIG_MCUX_COMPONENT_middleware.mbedtls3x.port.config=y
CONFIG_MCUX_COMPONENT_middleware.mbedtls3x.port.rng=y
CONFIG_MCUX_COMPONENT_middleware.mbedtls3x.port.psa_crypto_config=n
CONFIG_MCUX_COMPONENT_middleware.mbedtls3x.tests_certs_only=y
CONFIG_MCUX_COMPONENT_driver.conn_fwloader=y
CONFIG_MCUX_COMPONENT_driver.conn_fwloader.fw_bin=y
CONFIG_MCUX_PRJSEG_middleware.freertos-kernel.generated_config=n
